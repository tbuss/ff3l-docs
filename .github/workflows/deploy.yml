name: Deploy MkDocs

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Debug MkDocs plugins
        run: |
          python -m pip show mkdocs-revealjs
          mkdocs --version

      - name: Build
        run: mkdocs build

      - name: Debug RevealJS output
        run: |
          echo "=== Generated HTML ==="
          grep -n -E 'class="reveal|class="slides|revealjs|reveal\.js' site/slides/index.html || true
          echo "=== Generated files ==="
          find site -iname '*reveal*'

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
